name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version Node depuis .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

      # Tests Deno des fonctions Edge : hors du périmètre vitest (include limité
      # à src/**), ils ne tournaient jusqu'ici qu'à la main.
      # --frozen ne bloque rien en l'état (mesuré le 2026-08-30) : sans deno.json,
      # il n'a aucun graphe de dépendances déclaré à figer, et les imports HTTPS
      # des fonctions lui échappent. Gardé parce qu'il deviendra utile si un
      # deno.json arrive. La vraie protection est le deno.lock lui-même : une
      # empreinte qui ne correspond plus fait échouer le run, drapeau ou pas.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-check --frozen supabase/functions/
      - run: npm run build
