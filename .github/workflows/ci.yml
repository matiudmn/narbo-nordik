name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version Node depuis .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

      # Tests Deno des fonctions Edge : hors du périmètre vitest (include limité
      # à src/**), ils ne tournaient jusqu'ici qu'à la main.
      # deno check couvre les neuf index.ts, que le graphe de test ne charge pas.
      # C'est lui qui rend vivante l'entrée esm.sh du deno.lock, et donc --frozen
      # (mesuré le 2026-08-31, cache froid, lock privé de son pin : sans le
      # drapeau Deno résout supabase-js@2 en 2.112.4 et réécrit le lock en
      # silence ; avec, il échoue sur « lockfile is out of date »).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --frozen supabase/functions/
      - run: deno test --no-check --frozen supabase/functions/
      - run: npm run build
